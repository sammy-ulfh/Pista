<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Guion de 3 pasos para pedir la venta</title>
<desc id="d">Tres pasos unidos por flechas: resume lo que la persona necesita, propón un siguiente paso concreto y haz la pregunta y guarda silencio.</desc>
<defs><marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F1E1C"/></marker></defs>
<rect width="900" height="396" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#B84E1E" text-anchor="start"><tspan x="40" dy="0">Pedir la venta en 3 pasos</tspan></text>
<text x="40" y="84" font-size="17" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="40" dy="0">Sin presionar: resumes, propones y preguntas.</tspan></text>
<rect x="40" y="120" width="240" height="240" rx="12" fill="#F7E9E2" stroke="#1F1E1C" stroke-width="2"/>
<path d="M40,164 v-32 a12,12 0 0 1 12,-12 h216 a12,12 0 0 1 12,12 v32 z" fill="#B84E1E" stroke="#1F1E1C" stroke-width="2"/>
<text x="56" y="149" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="56" dy="0">1. Resume</tspan></text>
<text x="56" y="192" font-size="17" font-weight="400" fill="#1F1E1C" text-anchor="start"><tspan x="56" dy="0">Repite con sus palabras</tspan><tspan x="56" dy="22.1">lo que necesita.</tspan></text>
<line x1="56" y1="242" x2="264" y2="242" stroke="#D9D5CC" stroke-width="2"/>
<text x="56" y="270" font-size="16" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="56" dy="0">«Me dijo que quiere saber</tspan><tspan x="56" dy="20.8">cuánto gana cada semana.»</tspan></text>
<line x1="284" y1="255" x2="324" y2="255" stroke="#1F1E1C" stroke-width="3" marker-end="url(#punta)"/>
<rect x="330" y="120" width="240" height="240" rx="12" fill="#F7E9E2" stroke="#1F1E1C" stroke-width="2"/>
<path d="M330,164 v-32 a12,12 0 0 1 12,-12 h216 a12,12 0 0 1 12,12 v32 z" fill="#B84E1E" stroke="#1F1E1C" stroke-width="2"/>
<text x="346" y="149" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="346" dy="0">2. Propón</tspan></text>
<text x="346" y="192" font-size="17" font-weight="400" fill="#1F1E1C" text-anchor="start"><tspan x="346" dy="0">Un siguiente paso</tspan><tspan x="346" dy="22.1">concreto, con fecha.</tspan></text>
<line x1="346" y1="242" x2="554" y2="242" stroke="#D9D5CC" stroke-width="2"/>
<text x="346" y="270" font-size="16" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="346" dy="0">«Le armo la hoja el sábado</tspan><tspan x="346" dy="20.8">y le enseño a usarla.»</tspan></text>
<line x1="574" y1="255" x2="614" y2="255" stroke="#1F1E1C" stroke-width="3" marker-end="url(#punta)"/>
<rect x="620" y="120" width="240" height="240" rx="12" fill="#F7E9E2" stroke="#1F1E1C" stroke-width="2"/>
<path d="M620,164 v-32 a12,12 0 0 1 12,-12 h216 a12,12 0 0 1 12,12 v32 z" fill="#B84E1E" stroke="#1F1E1C" stroke-width="2"/>
<text x="636" y="149" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="636" dy="0">3. Pregunta y calla</tspan></text>
<text x="636" y="192" font-size="17" font-weight="400" fill="#1F1E1C" text-anchor="start"><tspan x="636" dy="0">Haz la pregunta y deja</tspan><tspan x="636" dy="22.1">que responda.</tspan></text>
<line x1="636" y1="242" x2="844" y2="242" stroke="#D9D5CC" stroke-width="2"/>
<text x="636" y="270" font-size="16" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="636" dy="0">«¿Le parece si empezamos</tspan><tspan x="636" dy="20.8">este sábado?»</tspan></text>
</svg>
