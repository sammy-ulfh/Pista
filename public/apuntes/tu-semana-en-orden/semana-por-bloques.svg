<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Ejemplo de semana por bloques</title>
<desc id="d">Una semana de lunes a domingo dividida en mañana, tarde y noche. Cada bloque tiene una sola actividad: clases, estudio, trabajo, descanso o tiempo libre. El domingo en la noche hay un bloque para planear la semana.</desc>
<defs><marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F1E1C"/></marker></defs>
