<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Guía visual de la respiración 4-4-4</title>
<desc id="d">Un triángulo con tres lados: inhala contando hasta 4, sostén el aire contando hasta 4 y exhala contando hasta 4. Repite cinco veces.</desc>
<defs><marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F1E1C"/></marker></defs>
<rect width="900" height="520" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="40" dy="0">Respiración 4-4-4</tspan></text>
<text x="40" y="84" font-size="17" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="40" dy="0">Sigue el triángulo. Cuenta despacio, sin forzar.</tspan></text>
<path d="M450,130 L680,440 L220,440 Z" fill="#E2F1EC" stroke="#1F1E1C" stroke-width="3" stroke-linejoin="round"/>
<line x1="240" y1="415" x2="435" y2="160" stroke="#177A62" stroke-width="4" marker-end="url(#punta)"/>
<line x1="465" y1="160" x2="660" y2="415" stroke="#177A62" stroke-width="4" marker-end="url(#punta)"/>
<line x1="650" y1="428" x2="250" y2="428" stroke="#177A62" stroke-width="4" marker-end="url(#punta)"/>
<text x="250" y="270" font-size="22" font-weight="700" fill="#1F1E1C" text-anchor="end"><tspan x="250" dy="0">1. Inhala</tspan></text>
<text x="250" y="296" font-size="17" font-weight="400" fill="#57534E" text-anchor="end"><tspan x="250" dy="0">por la nariz · 4</tspan></text>
<text x="650" y="270" font-size="22" font-weight="700" fill="#1F1E1C" text-anchor="start"><tspan x="650" dy="0">2. Sostén</tspan></text>
<text x="650" y="296" font-size="17" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="650" dy="0">el aire · 4</tspan></text>
<text x="450" y="478" font-size="22" font-weight="700" fill="#1F1E1C" text-anchor="middle"><tspan x="450" dy="0">3. Exhala lento por la boca · 4</tspan></text>
<text x="450" y="380" font-size="40" font-weight="700" fill="#177A62" text-anchor="middle"><tspan x="450" dy="0">×5</tspan></text>
</svg>
