<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Plantilla de una hoja para preparar tu presentación</title>
<desc id="d">Una hoja con casillas en blanco: tema, para quién es, mensaje en una frase, inicio, tres ideas con su ejemplo, cierre y tiempo total.</desc>
<defs><marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F1E1C"/></marker></defs>
<rect width="900" height="636" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="40" dy="0">Tu presentación en una hoja</tspan></text>
<text x="40" y="84" font-size="17" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="40" dy="0">Cópiala en papel o en tu cuaderno y llénala con frases cortas.</tspan></text>
<rect x="40" y="110" width="400" height="70" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="54" y="136" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="54" dy="0">Tema</tspan></text>
<rect x="460" y="110" width="400" height="70" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="474" y="136" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="474" dy="0">¿Para quién es?</tspan></text>
<rect x="40" y="195" width="820" height="70" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="54" y="221" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="54" dy="0">Mi mensaje en una frase</tspan></text>
<rect x="40" y="280" width="820" height="70" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="54" y="306" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="54" dy="0">Inicio: ¿cómo empiezo?</tspan></text>
<rect x="40" y="365" width="260" height="130" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="54" y="391" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="54" dy="0">Idea 1</tspan></text>
<text x="54" y="478" font-size="15" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="54" dy="0">Ejemplo:</tspan></text>
<rect x="320" y="365" width="260" height="130" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="334" y="391" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="334" dy="0">Idea 2</tspan></text>
<text x="334" y="478" font-size="15" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="334" dy="0">Ejemplo:</tspan></text>
<rect x="600" y="365" width="260" height="130" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="614" y="391" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="614" dy="0">Idea 3</tspan></text>
<text x="614" y="478" font-size="15" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="614" dy="0">Ejemplo:</tspan></text>
<rect x="40" y="510" width="600" height="90" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="54" y="536" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="54" dy="0">Cierre: ¿qué quiero que hagan o recuerden?</tspan></text>
<rect x="660" y="510" width="200" height="90" rx="12" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2"/>
<text x="674" y="536" font-size="16" font-weight="700" fill="#177A62" text-anchor="start"><tspan x="674" dy="0">Tiempo total</tspan></text>
</svg>
