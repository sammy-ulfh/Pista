<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Esquema de un bloque de estudio 25/5</title>
<desc id="d">Una línea de tiempo con cuatro rondas de 25 minutos de enfoque seguidas de 5 minutos de descanso, y al final un descanso largo de 15 a 30 minutos.</desc>
<defs><marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F1E1C"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#7A4FD1" text-anchor="start"><tspan x="40" dy="0">Bloques de 25 + 5</tspan></text>
<text x="40" y="84" font-size="17" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="40" dy="0">Cuatro rondas y un descanso largo. Ajusta los minutos si te funciona otro ritmo.</tspan></text>
<rect x="40" y="140" width="139.3793103448276" height="90" rx="8" fill="#7A4FD1" stroke="#1F1E1C" stroke-width="2"/>
<text x="110.6896551724138" y="182" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="110.6896551724138" dy="0">25 min</tspan></text>
<text x="110.6896551724138" y="206" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="110.6896551724138" dy="0">enfoque</tspan></text>
<rect x="181.3793103448276" y="140" width="26.275862068965516" height="90" rx="8" fill="#EEE8FA" stroke="#1F1E1C" stroke-width="2"/>
<text x="195.51724137931035" y="192" font-size="16" font-weight="700" fill="#1F1E1C" text-anchor="middle"><tspan x="195.51724137931035" dy="0">5</tspan></text>
<rect x="209.6551724137931" y="140" width="139.3793103448276" height="90" rx="8" fill="#7A4FD1" stroke="#1F1E1C" stroke-width="2"/>
<text x="280.3448275862069" y="182" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="280.3448275862069" dy="0">25 min</tspan></text>
<text x="280.3448275862069" y="206" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="280.3448275862069" dy="0">enfoque</tspan></text>
<rect x="351.0344827586207" y="140" width="26.275862068965516" height="90" rx="8" fill="#EEE8FA" stroke="#1F1E1C" stroke-width="2"/>
<text x="365.17241379310343" y="192" font-size="16" font-weight="700" fill="#1F1E1C" text-anchor="middle"><tspan x="365.17241379310343" dy="0">5</tspan></text>
<rect x="379.3103448275862" y="140" width="139.3793103448276" height="90" rx="8" fill="#7A4FD1" stroke="#1F1E1C" stroke-width="2"/>
<text x="450.0" y="182" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="450.0" dy="0">25 min</tspan></text>
<text x="450.0" y="206" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="450.0" dy="0">enfoque</tspan></text>
<rect x="520.6896551724138" y="140" width="26.275862068965516" height="90" rx="8" fill="#EEE8FA" stroke="#1F1E1C" stroke-width="2"/>
<text x="534.8275862068966" y="192" font-size="16" font-weight="700" fill="#1F1E1C" text-anchor="middle"><tspan x="534.8275862068966" dy="0">5</tspan></text>
<rect x="548.9655172413793" y="140" width="139.3793103448276" height="90" rx="8" fill="#7A4FD1" stroke="#1F1E1C" stroke-width="2"/>
<text x="619.6551724137931" y="182" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="619.6551724137931" dy="0">25 min</tspan></text>
<text x="619.6551724137931" y="206" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan x="619.6551724137931" dy="0">enfoque</tspan></text>
<rect x="690.3448275862069" y="140" width="26.275862068965516" height="90" rx="8" fill="#EEE8FA" stroke="#1F1E1C" stroke-width="2"/>
<text x="704.4827586206897" y="192" font-size="16" font-weight="700" fill="#1F1E1C" text-anchor="middle"><tspan x="704.4827586206897" dy="0">5</tspan></text>
<rect x="718.6206896551723" y="140" width="139.3793103448276" height="90" rx="8" fill="#FFFFFF" stroke="#1F1E1C" stroke-width="2" stroke-dasharray="6 5"/>
<text x="789.3103448275862" y="182" font-size="16" font-weight="700" fill="#1F1E1C" text-anchor="middle"><tspan x="789.3103448275862" dy="0">15–30 min</tspan></text>
<text x="789.3103448275862" y="206" font-size="13" font-weight="400" fill="#1F1E1C" text-anchor="middle"><tspan x="789.3103448275862" dy="0">descanso largo</tspan></text>
<text x="40" y="280" font-size="17" font-weight="400" fill="#1F1E1C" text-anchor="start"><tspan x="40" dy="0">Durante el enfoque: una sola tarea, celular lejos y notificaciones apagadas.</tspan></text>
<text x="40" y="312" font-size="17" font-weight="400" fill="#1F1E1C" text-anchor="start"><tspan x="40" dy="0">Durante el descanso: levántate, toma agua, estira. Mejor sin pantalla.</tspan></text>
<text x="40" y="360" font-size="16" font-weight="400" fill="#57534E" text-anchor="start"><tspan x="40" dy="0">Si te distraes, anota la distracción en una hoja y vuelve a la tarea.</tspan></text>
</svg>
